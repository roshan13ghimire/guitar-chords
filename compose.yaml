
name: guitar-chords-local

services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: guitar_chords_docker
      POSTGRES_USER: chords_user
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:?Set database password}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chords_user -d guitar_chords_docker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: guitar-chords-backend:1.0

    restart: unless-stopped

    ports:
      - "127.0.0.1:8001:8000"

    environment:
      SECRET_KEY: ${DOCKER_SECRET_KEY:?Set secret key}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

      DB_NAME: guitar_chords_docker
      DB_USER: chords_user
      DB_PASSWORD: ${DOCKER_DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: prefer
      DB_CONN_MAX_AGE: "0"

      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:8001,http://127.0.0.1:8001

      TRUST_PROXY: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOW_LOCAL_PRIVATE_SONGS: "False"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
